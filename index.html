<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KIMS Mahadevapura — Insights Platform v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --teal-1: #1e5b75;
    --teal-2: #2a7a9c;
    --teal-deep: #0d3b4f;
    --navy: #0a2540;
    --gold: #d4af37;
    --gold-soft: #e6c965;
    --gold-deep: #8b6914;
    --paper: #f7fbfc;
    --paper-2: #eaf4f7;
    --paper-3: #d4e2e8;
    --ink: #0a1929;
    --ink-2: #2d3a4a;
    --muted: #6b7a8a;
    --line: #d4e2e8;
    --good: #2d6a4f;
    --good-bg: #e8f5ee;
    --warn: #b86b00;
    --warn-bg: #fff5e6;
    --alert: #c1272d;
    --alert-bg: #fff1f2;
    --purple: #5b3a8f;
    --purple-bg: #f3eefa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, var(--teal-1) 0%, var(--teal-deep) 100%);
    color: white;
    padding: 18px 28px;
    box-shadow: 0 2px 12px rgba(13, 59, 79, 0.3);
  }
  header .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
  }
  header .sub {
    font-size: 0.78rem;
    color: var(--gold-soft);
    margin-top: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header select {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 7px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }
  header select option { background: var(--teal-deep); color: white; }

  /* ===== NAV TABS ===== */
  .nav-tabs {
    background: white;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    padding: 0 20px;
    display: flex;
    gap: 4px;
  }
  .nav-tab {
    padding: 12px 18px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-tab:hover { color: var(--teal-1); background: var(--paper-2); }
  .nav-tab.active {
    color: var(--teal-1);
    border-bottom-color: var(--gold);
    font-weight: 600;
  }
  .nav-tab .ico { font-size: 1.1rem; opacity: 0.85; }
  .nav-tab .new-badge {
    background: var(--gold);
    color: var(--navy);
    font-size: 0.58rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 22px 20px 60px;
  }

  /* ===== STATES ===== */
  .loading, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .loading .spinner {
    border: 3px solid var(--paper-2);
    border-top-color: var(--teal-1);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.4; }
  .empty h4 { color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
  .empty p { font-size: 0.88rem; max-width: 460px; margin: 0 auto; line-height: 1.5; }

  .demo-banner {
    background: linear-gradient(135deg, var(--warn-bg), #fff8d6);
    border-left: 4px solid var(--warn);
    padding: 12px 18px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 0.84rem;
    color: var(--ink-2);
  }
  .demo-banner strong { color: var(--warn); }
  .demo-banner code {
    background: white;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 0.82rem;
  }

  /* ===== KPI STRIP ===== */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  .kpi {
    background: white;
    padding: 16px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .kpi.alert::before { background: var(--alert); }
  .kpi.warn::before { background: var(--warn); }
  .kpi.good::before { background: var(--good); }
  .kpi.info::before { background: var(--teal-2); }
  .kpi.purple::before { background: var(--purple); }
  .kpi .lbl {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .kpi .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.85rem;
    color: var(--teal-deep);
    font-weight: 700;
    line-height: 1;
  }
  .kpi .delta { font-size: 0.74rem; margin-top: 5px; font-weight: 600; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--alert); }
  .delta.flat { color: var(--muted); }
  .delta.up-bad { color: var(--alert); }
  .delta.down-good { color: var(--good); }

  /* ===== NARRATIVE EXPORT CARD ===== */
  .narrative-card {
    background: linear-gradient(135deg, white, var(--paper-2));
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 22px;
  }
  .narrative-card .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 2px;
    color: var(--gold-deep);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .narrative-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--teal-deep);
    margin-bottom: 4px;
  }
  .narrative-card p {
    font-size: 0.85rem;
    color: var(--ink-2);
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .narrative-card .narrative-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 9px 16px;
    border: 1.5px solid var(--teal-1);
    background: var(--teal-1);
    color: white;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.83rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--teal-deep); transform: translateY(-1px); }
  .btn.secondary { background: white; color: var(--teal-1); }
  .btn.secondary:hover { background: var(--paper-2); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .btn.gold:hover { background: #b8961e; border-color: #b8961e; }
  .btn.small { padding: 6px 12px; font-size: 0.78rem; }

  /* ===== SECTION HEADS ===== */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    margin-top: 26px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-head h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--teal-1);
    font-weight: 600;
  }
  .section-head .tagline {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== SIGNAL CARDS ===== */
  .signals {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
    gap: 12px;
  }
  .signal {
    background: white;
    border-radius: 11px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal-1);
    transition: all 0.2s;
  }
  .signal:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(13, 59, 79, 0.08); }
  .signal.alert { border-left-color: var(--alert); background: linear-gradient(135deg, white, var(--alert-bg)); }
  .signal.warn { border-left-color: var(--warn); background: linear-gradient(135deg, white, var(--warn-bg)); }
  .signal.good { border-left-color: var(--good); background: linear-gradient(135deg, white, var(--good-bg)); }
  .signal.info { border-left-color: var(--teal-2); }
  .signal.purple { border-left-color: var(--purple); background: linear-gradient(135deg, white, var(--purple-bg)); }
  .signal-tag {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 7px;
    margin-bottom: 7px;
  }
  .signal.alert .signal-tag { background: var(--alert); color: white; }
  .signal.warn .signal-tag { background: var(--warn); color: white; }
  .signal.good .signal-tag { background: var(--good); color: white; }
  .signal.info .signal-tag { background: var(--teal-2); color: white; }
  .signal.purple .signal-tag { background: var(--purple); color: white; }
  .signal h4 {
    font-size: 0.94rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 5px;
    line-height: 1.35;
  }
  .signal p {
    font-size: 0.83rem;
    color: var(--ink-2);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .signal .recommendation {
    font-size: 0.77rem;
    color: var(--teal-1);
    font-weight: 600;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    margin-top: 6px;
  }
  .signal.alert .recommendation { color: var(--alert); }
  .signal.warn .recommendation { color: var(--warn); }
  .signal.good .recommendation { color: var(--good); }
  .signal.purple .recommendation { color: var(--purple); }

  /* ===== CHARTS ===== */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
    margin-top: 14px;
  }
  .chart-card {
    background: white;
    border-radius: 11px;
    padding: 16px;
    border: 1px solid var(--line);
  }
  .chart-card h5 {
    font-size: 0.82rem;
    color: var(--teal-1);
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .chart-wrap { height: 240px; }

  /* ===== COHORT TRACKER CARDS ===== */
  .cohort-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .cohort {
    background: white;
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .cohort.ready {
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, white, #fff8e8);
  }
  .cohort .cohort-tag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--teal-2);
    color: white;
  }
  .cohort.ready .cohort-tag {
    background: var(--gold);
    color: var(--navy);
  }
  .cohort h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.18rem;
    color: var(--teal-deep);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .cohort .meta {
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .cohort .progress-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .cohort .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem;
    color: var(--teal-1);
    font-weight: 700;
    line-height: 1;
  }
  .cohort.ready .num { color: var(--gold-deep); }
  .cohort .target {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .cohort .progress-bar {
    height: 6px;
    background: var(--paper-2);
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0 12px;
  }
  .cohort .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal-1), var(--teal-2));
    transition: width 0.6s;
  }
  .cohort.ready .progress-fill {
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  }
  .cohort .insight {
    font-size: 0.83rem;
    color: var(--ink-2);
    line-height: 1.5;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }

  /* ===== WORKLOAD VIEW ===== */
  .workload-grid {
    background: white;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .workload-row {
    display: grid;
    grid-template-columns: 1.5fr 60px 1fr 90px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .workload-row:last-child { border-bottom: none; }
  .workload-row.header {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--teal-1);
  }
  .workload-row .name { font-weight: 600; color: var(--ink); font-size: 0.9rem; }
  .workload-row .count { font-weight: 700; color: var(--teal-1); font-size: 1.05rem; text-align: right; }
  .workload-row .bar-container {
    background: var(--paper-2);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }
  .workload-row .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--teal-1), var(--teal-2));
  }
  .workload-row.high .bar { background: linear-gradient(90deg, var(--warn), #d4830e); }
  .workload-row.alert .bar { background: linear-gradient(90deg, var(--alert), #d63a40); }
  .workload-row .flag {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .flag.normal { background: var(--paper-2); color: var(--muted); }
  .flag.heavy { background: var(--warn-bg); color: var(--warn); }
  .flag.burnout-risk { background: var(--alert-bg); color: var(--alert); }
  .flag.under { background: var(--purple-bg); color: var(--purple); }

  /* ===== VIEW PANELS ===== */
  .view-panel { display: none; }
  .view-panel.active { display: block; }

  /* ===== BURNOUT DASHBOARD ===== */
  .burnout-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .burnout-stat {
    background: white;
    padding: 18px;
    border-radius: 11px;
    border: 1px solid var(--line);
    text-align: center;
  }
  .burnout-stat.alert { border-top: 3px solid var(--alert); }
  .burnout-stat.warn { border-top: 3px solid var(--warn); }
  .burnout-stat.good { border-top: 3px solid var(--good); }
  .burnout-stat .stat-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--teal-deep);
    line-height: 1;
    margin-bottom: 5px;
  }
  .burnout-stat .stat-lbl {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* ===== AI WORKFLOWS ===== */
  .workflow-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }
  .workflow {
    background: white;
    border-radius: 12px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    transition: all 0.2s;
    cursor: pointer;
  }
  .workflow:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(13, 59, 79, 0.1);
    border-color: var(--gold);
  }
  .workflow .ico {
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .workflow h4 {
    font-size: 0.95rem;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .workflow p {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.45;
    margin-bottom: 10px;
  }
  .workflow .freq {
    font-size: 0.68rem;
    color: var(--gold-deep);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
  }

  /* ===== MEMORY VIEW ===== */
  .memory-list {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .memory-entry {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 130px 1fr 100px;
    gap: 14px;
    align-items: center;
    transition: background 0.15s;
    cursor: pointer;
  }
  .memory-entry:hover { background: var(--paper-2); }
  .memory-entry:last-child { border-bottom: none; }
  .memory-entry .date {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .memory-entry .title {
    font-size: 0.92rem;
    color: var(--ink);
    font-weight: 500;
  }
  .memory-entry .title .preview {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 3px;
  }
  .memory-entry .action {
    font-size: 0.77rem;
    color: var(--teal-1);
    font-weight: 600;
    text-align: right;
  }

  /* ===== MODAL ===== */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13, 59, 79, 0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    max-width: 720px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
  }
  .modal h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: var(--teal-deep);
    margin-bottom: 8px;
    padding-right: 30px;
  }
  .modal .modal-sub {
    color: var(--muted);
    font-size: 0.86rem;
    margin-bottom: 18px;
  }
  .modal ol, .modal ul {
    margin-left: 22px;
    margin-bottom: 16px;
  }
  .modal li {
    font-size: 0.9rem;
    color: var(--ink-2);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .modal pre {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    font-family: 'Consolas', monospace;
    font-size: 0.76rem;
    color: var(--teal-deep);
    overflow-x: auto;
    max-height: 280px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.45;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.5rem;
    cursor: pointer;
    position: absolute;
    top: 18px;
    right: 22px;
    line-height: 1;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .kpi-strip { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .burnout-stats { grid-template-columns: 1fr; }
    .workload-row { grid-template-columns: 1.5fr 50px 70px; }
    .workload-row .bar-container { display: none; }
    .memory-entry { grid-template-columns: 1fr; }
    .header-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>

function jsonpRequest(url) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Math.random().toString(36).substr(2, 9);
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out — backend not responding'));
    }, 15000);

    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = () => {
      cleanup();
      reject(new Error('Failed to load backend — check the URL'));
    };
    document.head.appendChild(script);
  });
}

async function loadData() {

  try {
    if (DEMO_MODE) {

      currentData = DEMO_DATA;
    } else {
      const data = await jsonpRequest(`${BACKEND_URL}?action=fullDashboard&month=${currentMonth}`);
      if (!data.ok) throw new Error(data.error || 'Backend error');
      currentData = data;
    }
    renderView(currentView);
  } catch (err) {
    showError(err.message);
  }
}

function openExport(action) {
  const p = PROMPTS[action];
  if (!p) return;

  let payload;
  if (action === 'ruleBasedSummary') {
    const k = currentData.kpis;
    payload = `MAHADEVAPURA ANAESTHESIA — ${currentData.month}\n\n` +
      `Total cases: ${k.totalCases} (${k.casesDeltaPct > 0 ? '+' : ''}${k.casesDeltaPct.toFixed(1)}% vs prev)\n` +
      `Complication rate: ${k.complicationRate}% (${k.complicationDeltaPp > 0 ? '+' : ''}${k.complicationDeltaPp} pp)\n` +
      `Emergency share: ${k.emergencyShare}% (${k.emergencyShareDeltaPp > 0 ? '+' : ''}${k.emergencyShareDeltaPp} pp)\n` +
      `Regional share: ${k.regionalShare}% (${k.regionalShareDeltaPp > 0 ? '+' : ''}${k.regionalShareDeltaPp} pp)\n` +
      `ASA III+ proportion: ${k.asaThreePlusShare}%\n` +
      `Mean duration: ${k.meanDuration} min\n\n` +
      `SIGNALS DETECTED: ${currentData.signals.length}\n` +
      currentData.signals.map((s, i) => `${i+1}. [${s.severity.toUpperCase()}] ${s.title}`).join('\n');
  } else {
    payload = p.prompt + '\n\n' + JSON.stringify({
      site: currentData.site,
      month: currentData.month,
      kpis: currentData.kpis,
      signals: currentData.signals,
      techniqueDist: currentData.techniqueDist,
      saturdayTrend: currentData.saturdayTrend,
      consultants: action === 'rotaPlanning' ? currentData.consultants : undefined,
      cohorts: (action === 'cohortAbstract' || action === 'researchScan') ? currentData.cohorts : undefined,
      note: 'Patient identifiers stripped. Aggregated data only.'
    }, null, 2);
  }

  const html = `
    <h3>${escapeHtml(p.title)}</h3>
    <div class="modal-sub">${escapeHtml(p.sub)}</div>
    <ol>
      ${p.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
    </ol>
    <pre id="exportPayload">${escapeHtml(payload)}</pre>
    <div class="modal-actions">
      <button class="btn gold" onclick="copyPayload()">📋 Copy prompt + data</button>
      <button class="btn secondary" onclick="downloadPayload('${action}')">⬇ Download as text</button>
      <button class="btn secondary" onclick="closeModal()">Close</button>
    </div>
  `;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function copyPayload() {
  const text = document.getElementById('exportPayload').textContent;
  try {
    await navigator.clipboard.writeText(text);
    alert('Copied. Now open Claude.ai and paste.');
  } catch (err) {
    alert('Could not copy automatically. Select the text and copy manually.');
  }
}

function downloadPayload(action) {
  const text = document.getElementById('exportPayload').textContent;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mahadevapura_${action}_${currentMonth}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}
